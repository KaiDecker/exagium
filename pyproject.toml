[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "exagium"
version = "0.1.0"
description = "Bring your own agent. Run it, trace it, evaluate it, compare it."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Exagium contributors"}]
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.116,<1.0",
    "pydantic>=2.11,<3.0",
    "PyYAML>=6.0,<7.0",
    "SQLAlchemy>=2.0,<2.1",
    "typer>=0.16,<1.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.12,<1.0",
]

[project.scripts]
exagium = "exagium.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
